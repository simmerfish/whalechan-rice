<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f0ff"/><stop offset="0.55" stop-color="#a5d8f7"/><stop offset="1" stop-color="#6fb6e8"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa9e6"/><stop offset="1" stop-color="#2b6fb5"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6ecff"/>
    </linearGradient>
    <linearGradient id="tailG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cc9ee"/><stop offset="1" stop-color="#5aa4dd"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9db4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff9db4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.38" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="line" stroke="#3d6f96" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

    <g id="wg">
      <!-- 鲸尾（明显露在右侧） -->
      <g transform="translate(112,168) rotate(-22)">
        <ellipse cx="-40" cy="-6" rx="46" ry="19" fill="url(#tailG)" stroke="#3d6f96" stroke-width="3"/>
        <ellipse cx="40" cy="-6" rx="46" ry="19" fill="url(#tailG)" stroke="#3d6f96" stroke-width="3"/>
      </g>
      <!-- 身体 -->
      <ellipse cx="0" cy="132" rx="70" ry="78" fill="url(#dress)" stroke="#3d6f96" stroke-width="3.2"/>
      <ellipse cx="0" cy="146" rx="47" ry="54" fill="url(#belly)" stroke="#8fc3e4" stroke-width="2.4"/>
      <!-- 手鳍 -->
      <ellipse cx="-74" cy="148" rx="19" ry="33" transform="rotate(26 -74 148)" fill="url(#skin)" stroke="#3d6f96" stroke-width="3"/>
      <ellipse cx="74" cy="148" rx="19" ry="33" transform="rotate(-26 74 148)" fill="url(#skin)" stroke="#3d6f96" stroke-width="3"/>
      <!-- 头 -->
      <ellipse cx="0" cy="0" rx="110" ry="99" fill="url(#skin)" stroke="#3d6f96" stroke-width="3.2"/>
      <ellipse cx="0" cy="0" rx="110" ry="99" fill="url(#shine)"/>
      <!-- 侧鳍耳 -->
      <path d="M -92 2 C -132 -14 -146 24 -122 52 C -108 44 -96 24 -92 2 Z" fill="url(#skin)" stroke="#3d6f96" stroke-width="3"/>
      <path d="M 92 2 C 132 -14 146 24 122 52 C 108 44 96 24 92 2 Z" fill="url(#skin)" stroke="#3d6f96" stroke-width="3"/>
      <!-- 眼睛 -->
      <ellipse cx="-40" cy="10" rx="18" ry="22" fill="#22304a"/>
      <circle cx="-46" cy="1" r="7" fill="#ffffff"/>
      <circle cx="-34" cy="18" r="3.4" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="40" cy="10" rx="18" ry="22" fill="#22304a"/>
      <circle cx="34" cy="1" r="7" fill="#ffffff"/>
      <circle cx="46" cy="18" r="3.4" fill="#ffffff" opacity="0.85"/>
      <!-- 腮红 -->
      <ellipse cx="-68" cy="46" rx="20" ry="12" fill="url(#blush)"/>
      <ellipse cx="68" cy="46" rx="20" ry="12" fill="url(#blush)"/>
      <!-- 头顶喷水 -->
      <g transform="translate(0,-96)">
        <path d="M -8 6 Q -34 -14 -22 -40" stroke="#8fd0f2" stroke-width="5.5" fill="none" stroke-linecap="round"/>
        <path d="M 8 6 Q 34 -14 22 -40" stroke="#8fd0f2" stroke-width="5.5" fill="none" stroke-linecap="round"/>
        <circle cx="0" cy="-50" r="9" fill="#b9e5fb" stroke="#7cc3ea" stroke-width="2.5"/>
        <circle cx="-23" cy="-48" r="6" fill="#b9e5fb" stroke="#7cc3ea" stroke-width="2.5"/>
        <circle cx="23" cy="-48" r="6" fill="#b9e5fb" stroke="#7cc3ea" stroke-width="2.5"/>
      </g>
    </g>
  </defs>

  <rect width="760" height="560" fill="#f4fbff"/>
  <ellipse cx="190" cy="286" rx="320" ry="196" fill="#e6f6ff" opacity="0.7"/>
  <ellipse cx="570" cy="286" rx="320" ry="196" fill="#e6f6ff" opacity="0.7"/>

  <!-- 左：闭嘴 -->
  <ellipse cx="190" cy="474" rx="104" ry="15" fill="#b9dff2" opacity="0.4"/>
  <g transform="translate(190,288) scale(0.84) translate(-190,-288)">
    <use href="#wg" x="190" y="288"/>
    <path d="M 172 346 Q 181 357 190 346 Q 199 357 208 346"
          stroke="#3d6f96" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="190" y="534" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif"
        font-size="23" fill="#4a7fa5" font-weight="600">平时 · 闭嘴</text>

  <!-- 右：张嘴 -->
  <ellipse cx="570" cy="474" rx="104" ry="15" fill="#b9dff2" opacity="0.4"/>
  <g transform="translate(570,288) scale(0.84) translate(-570,-288)">
    <use href="#wg" x="570" y="288"/>
    <ellipse cx="570" cy="352" rx="29" ry="33" fill="#7e2f3f" stroke="#3d6f96" stroke-width="4"/>
    <ellipse cx="570" cy="370" rx="19" ry="14" fill="#ff90a7"/>
    <ellipse cx="562" cy="342" rx="7" ry="5" fill="#ffffff" opacity="0.35"/>
  </g>
  <text x="570" y="534" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif"
        font-size="23" fill="#4a7fa5" font-weight="600">接饭 · 张嘴</text>
</svg>