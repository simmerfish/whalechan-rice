<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06101c">
<title>鲸鱼娘吃大白饭</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#06101c;overflow:hidden;
    font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #game{display:block;background:#09203a;border-radius:6px;touch-action:none;
    box-shadow:0 0 0 1px rgba(120,200,255,.18),0 24px 80px rgba(0,0,0,.75);}
  /* 手机竖屏时提示转横屏（纯 CSS，不依赖 JS） */
  #rotate{display:none;position:fixed;inset:0;z-index:9;background:#06101c;
    flex-direction:column;align-items:center;justify-content:center;gap:20px;
    color:#9fdcff;font-size:18px;letter-spacing:1px;text-align:center;padding:28px;}
  #rotate b{font-size:25px;color:#e6f7ff;letter-spacing:2px;}
  #rotate .ph{font-size:62px;display:block;animation:tilt 2.4s ease-in-out infinite;}
  @keyframes tilt{0%,35%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex;} }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="rotate">
  <span class="ph">📱</span>
  <b>请把手机横过来</b>
  <div>这是一个横屏游戏，转一下就能玩啦 🐳</div>
</div>
<script>
"use strict";
(function(){

/* ============================================================
   鲸鱼娘吃大白饭  v1.2
   单文件 / 原生 JS / Canvas 2D / 零依赖
   逻辑分辨率 960x540
   操作：键盘 / 鼠标点击 / 手机触屏（多点）
   ============================================================ */

var W = 960, H = 540;
var cv  = document.getElementById('game');
var ctx = cv.getContext('2d');
var DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  var s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = Math.max(1, Math.round(W * s)) + 'px';
  cv.style.height = Math.max(1, Math.round(H * s)) + 'px';
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- 调参区（想改手感就改这里） ---------------- */
var DIFFS = {
  easy:   { key:'easy',   name:'简单', speed:120, spawn:1.20, penStart:40, penRatio:0.22, drain:0.9, scoreMul:0.8, goal:90,
            desc:'下落慢、惩罚少，先熟悉手感 · 撑满 90 秒' },
  normal: { key:'normal', name:'普通', speed:170, spawn:1.00, penStart:25, penRatio:0.30, drain:1.2, scoreMul:1.0, goal:75,
            desc:'标准节奏，推荐从这里开始 · 撑满 75 秒' },
  hard:   { key:'hard',   name:'困难', speed:230, spawn:0.82, penStart:15, penRatio:0.38, drain:1.5, scoreMul:1.3, goal:60,
            desc:'快、狠、准，奖励也最高 · 撑满 60 秒' }
};
var DIFF_ORDER = ['easy','normal','hard'];

var FULLNESS_MAX   = 100;
var FULLNESS_START = 65;
var SPEED_RAMP_SEC = 75;    // 多少秒后下落速度加到顶
var SPEED_RAMP_MAX = 0.55;  // 最高加速 55%

var ART_H = 300;            // 角色绘制高度（逻辑像素）
var GROUND = 556;           // 脚底 y（略微超出画面底边，构图更好看）
var SPR_CX = 0.456;         // 角色身体中线在立绘中的横向比例
var SPR_MY = 0.272;         // 嘴巴在立绘中的纵向比例
var MOUTH_RX = 62, MOUTH_RY = 50;   // 嘴部判定椭圆（越大越好接）
var BODY_HW = 54, BODY_TOP_F = 0.60;

var WIN_BONUS = 300;          // 通关（撑满时长）奖励基础分，再乘难度倍率
var BUFF_CHANCE = 0.06;       // 每次出怪抽到 buff 的概率
var BUFF_ON_FIELD_MAX = 2;    // 同屏最多几个 buff 道具
var MOVE_ACC = 7200, MOVE_DAMP = 9.0, MOVE_MAXV = 820;  // 左右移动手感
var SLOW_FACTOR = 0.60;       // 「细嚼慢咽」全局下落速度倍率

var C = {
  ink:'#0e2137', navy:'#1b3a63', blue:'#2f6bb0', cyan:'#5cc8e8', sky:'#a9e4f5',
  cream:'#f7ead8', gold:'#e8b74a', white:'#ffffff', pink:'#ff9db3', green:'#5fd08a'
};

/* ---------------- 存档 ---------------- */
var SAVE_KEY = 'whalechan-rice-v1';
var save = { best:{easy:0,normal:0,hard:0}, sound:true, diff:'normal' };
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    var o = JSON.parse(raw);
    if (o && o.best) {
      save.best.easy   = o.best.easy   | 0;
      save.best.normal = o.best.normal | 0;
      save.best.hard   = o.best.hard   | 0;
    }
    if (typeof o.sound === 'boolean') save.sound = o.sound;
    if (o.diff && DIFFS[o.diff]) save.diff = o.diff;
  }
} catch(e) {}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e) {} }

/* ---------------- 音效（WebAudio 现场合成，零素材） ---------------- */
var AC = null;
function audioCtx(){
  if (AC === false) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = false; return null; } }
  if (AC.state === 'suspended') { try { AC.resume(); } catch(e){} }
  return AC;
}
function beep(freq, dur, type, vol, slideTo, delay){
  if (!save.sound) return;
  var ac = audioCtx(); if (!ac) return;
  var t0 = ac.currentTime + (delay || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
var SFX = {
  eat:    function(c){ var f = 480 + Math.min(c, 25) * 22; beep(f, 0.09, 'triangle', 0.16, f * 1.5); },
  golden: function(){ beep(880, 0.08, 'triangle', 0.14, 1200); beep(1320, 0.11, 'triangle', 0.11, 1600, 0.07); },
  buff:   function(){ beep(660, 0.09, 'sine', 0.14); beep(990, 0.09, 'sine', 0.13, null, 0.07); beep(1320, 0.14, 'sine', 0.12, null, 0.14); },
  miss:   function(){ beep(190, 0.11, 'sine', 0.10, 120); },
  junk:   function(){ beep(170, 0.28, 'sawtooth', 0.13, 62); beep(90, 0.30, 'square', 0.07, 50); },
  ui:     function(){ beep(760, 0.045, 'square', 0.055); },
  win:    function(){ beep(660,0.12,'triangle',0.15); beep(880,0.12,'triangle',0.14,null,0.10); beep(1174,0.14,'triangle',0.13,null,0.20); beep(1568,0.30,'triangle',0.12,null,0.31); },
  over:   function(){ beep(520, 0.16, 'sine', 0.14, 380); beep(380, 0.18, 'sine', 0.13, 260, 0.15); beep(260, 0.42, 'sine', 0.12, 130, 0.31); }
};

/* ---------------- 输入 ---------------- */
var keys = Object.create(null);
var MOUTH_KEYS = { 'Space':1, 'ArrowUp':1, 'KeyW':1 };
window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
      e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Enter') e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  audioCtx();                 // 首次按键解锁音频
  onKey(e.code);
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ keys = Object.create(null); });
function down(c){ return !!keys[c]; }
function mouthHeld(){ return !!(keys['Space'] || keys['ArrowUp'] || keys['KeyW']) || (touchMouth && touchLive()); }
function leftHeld(){ return !!(keys['ArrowLeft'] || keys['KeyA']) || (touchLeft && touchLive()); }
function rightHeld(){ return !!(keys['ArrowRight'] || keys['KeyD']) || (touchRight && touchLive()); }

/* ============================================================
   触屏 / 鼠标
   规则：左下两个圆键 = 左右移动；按住屏幕其它任何地方 = 张嘴。
   支持多点（左拇指推方向 + 右拇指按住张嘴可以同时成立）。
   ============================================================ */
var isTouchDev = false;
try { isTouchDev = ('ontouchstart' in window) || (typeof navigator !== 'undefined' && (navigator.maxTouchPoints | 0) > 0); } catch(e) {}

var touchUI    = false;   // 真的用过触摸之后，才把屏幕虚拟按键显示出来
function tapMode(){ return touchUI || isTouchDev; }   // 触摸设备一进标题页就先按触屏文案提示
var touchMouth = false, touchLeft = false, touchRight = false;
var contacts   = Object.create(null);      // pointerId -> { role:'mouth'|'btn', dir:-1|0|1 }

/* 虚拟按键几何（逻辑坐标，960x540） */
var BTN_L     = { x: 104, y: 414, r: 54 };   // ◀ 左移
var BTN_R     = { x: 240, y: 414, r: 54 };   // ▶ 右移
var BTN_MOUTH = { x: W - 128, y: 410, r: 70 };// 张嘴（按屏幕别处也等效）
var BTN_PAUSE = { x: 300, y: 44,  r: 26 };   // 右上方的暂停键

function inCircle(px, py, b){ var dx = px - b.x, dy = py - b.y; return dx*dx + dy*dy <= b.r*b.r; }
function touchLive(){ return state === 'play'; }   // 只有对局中才把触摸当成操作

function roleAt(px, py){
  if (inCircle(px, py, BTN_PAUSE)) return { role:'pause', dir:0 };
  if (inCircle(px, py, BTN_L))     return { role:'btn',   dir:-1  };
  if (inCircle(px, py, BTN_R))     return { role:'btn',   dir: 1  };
  return { role:'mouth', dir:0 };
}
function syncTouch(){
  touchMouth = false; touchLeft = false; touchRight = false;
  for (var id in contacts){
    var c = contacts[id];
    if (c.role === 'mouth') touchMouth = true;
    else if (c.role === 'btn'){
      if (c.dir < 0) touchLeft = true;
      else if (c.dir > 0) touchRight = true;
    }
  }
}
function clearTouch(){ contacts = Object.create(null); syncTouch(); }

/* 屏幕坐标 -> 逻辑坐标（画布可能被等比缩放） */
function localPos(e){
  var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : null;
  if (!r || !r.width) return { x: e.clientX, y: e.clientY };
  return { x: (e.clientX - r.left) * (W / r.width),
           y: (e.clientY - r.top)  * (H / r.height) };
}

/* ---------------- 点击热区 ---------------- */
/* 每帧由各个界面重建；键盘和点击共用同一套动作函数 */
var HITS = [];
function hit(x, y, w, h, act){ HITS.push({ x:x, y:y, w:w, h:h, act:act }); }
function tapAt(px, py){
  for (var i = HITS.length - 1; i >= 0; i--){
    var o = HITS[i];
    if (px >= o.x && px <= o.x + o.w && py >= o.y && py <= o.y + o.h){ o.act(); return true; }
  }
  return false;
}

/* ---------------- 界面动作（键盘 / 点击共用） ---------------- */
function backToTitle(){ state = 'title'; menuIdx = 0; }
function titleConfirm(){
  if (menuIdx === 0)      { diffReturnTo = 'play'; menuIdx = DIFF_ORDER.indexOf(save.diff); state = 'diff'; }
  else if (menuIdx === 1) { codexPage = 0; state = 'codex'; }
  else if (menuIdx === 2) { diffReturnTo = 'title'; menuIdx = DIFF_ORDER.indexOf(save.diff); state = 'diff'; }
  else if (menuIdx === 3) { save.sound = !save.sound; persist(); }
  else if (menuIdx === 4) { state = 'best'; }
}
function diffConfirm(){
  var k = DIFF_ORDER[menuIdx];
  save.diff = k; persist();
  if (diffReturnTo === 'play') { newGame(k); state = 'play'; }
  else { backToTitle(); }
}
function pauseConfirm(){
  if (menuIdx === 0)      state = 'play';
  else if (menuIdx === 1) { newGame(G.diff.key); state = 'play'; }
  else                    backToTitle();
}
function overConfirm(){ newGame(G.diff.key); state = 'play'; }
function codexPrev(){ codexPage = (codexPage + CODEX_PAGES - 1) % CODEX_PAGES; }
function codexNext(){ codexPage = (codexPage + 1) % CODEX_PAGES; }
function toggleFullscreen(){
  try {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (req) req.call(el);
  } catch(e) {}
  try {
    if (typeof screen !== 'undefined' && screen.orientation && screen.orientation.lock){
      var pr = screen.orientation.lock('landscape');
      if (pr && pr['catch']) pr['catch'](function(){});
    }
  } catch(e) {}
  SFX.ui();
}

/* ---------------- 立绘 ---------------- */
var ART = { closed:null, open:null, happy:null };
/* ART_INLINE：普通版是 null，立绘从 art/ 目录读文件。
   tools/inline.py 生成「自包含单文件版」时，会把下一行整行换成内联的 base64，
   这样那个 html 就算身边没有 art/ 目录、也完全不联网，照样能玩。 */
var ART_INLINE = null;
var artOK = false;
(function loadArt(){
  var names = ['closed','open','happy'], left = names.length, ok = 0;
  names.forEach(function(k){
    var im = new Image();
    im.onload  = function(){ if (im.naturalWidth > 0) ok++; if (--left === 0) artOK = (ok === 3); };
    im.onerror = function(){ if (--left === 0) artOK = (ok === 3); };
    im.src = (ART_INLINE && ART_INLINE[k]) || ('art/whalechan-' + k + '.png');
    ART[k] = im;
  });
})();
function artSize(img){ return img && img.naturalHeight ? img.naturalWidth / img.naturalHeight * ART_H : ART_H * 0.5; }

/* ---------------- 道具表 ---------------- */
var ITEMS = {
  rice:   { kind:'food', r:26, score:10, food:6,  spd:1.00, name:'大白饭',
            desc:'基础中的基础。张嘴接住：+10 分，饱食度 +6。' },
  golden: { kind:'food', r:26, score:20, food:10, spd:1.20, name:'黄金大白饭',
            desc:'严格两倍分：+20 分，饱食度 +10，但下落快 20%。' },
  onigiri:{ kind:'buff', r:28, spd:1.20, buff:'fullness', name:'大饭团',
            desc:'立刻回复 35% 饱食度，最能救命的一个。' },
  bubble: { kind:'buff', r:28, spd:1.20, buff:'shield', name:'泡泡护盾',
            desc:'8 秒内惩罚物全被弹开——这段时间可以放心张嘴。' },
  star:   { kind:'buff', r:28, spd:1.20, buff:'double', name:'双倍分数',
            desc:'10 秒内得分 x2；和黄金饭叠乘就是 x4。' },
  chew:   { kind:'buff', r:28, spd:1.20, buff:'slow', name:'细嚼慢咽',
            desc:'全场下落速度 -40%，持续 8 秒。慢慢吃，不慌。' },
  magnet: { kind:'buff', r:28, spd:1.20, buff:'magnet', name:'鲸吞磁力',
            desc:'8 秒内白饭会被吸向嘴巴，站着不动也能吃到。' },
  goldrain:{ kind:'buff', r:28, spd:1.20, buff:'gold', name:'黄金雨',
            desc:'10 秒内白饭全部变成黄金饭，分数翻倍时间。' },
  bag:    { kind:'junk', r:30, food:12, spd:0.95, name:'塑料袋',
            desc:'饱食度 -12，断连击，闭嘴硬直 1.2 秒。' },
  can:    { kind:'junk', r:28, food:16, spd:1.05, name:'易拉罐',
            desc:'饱食度 -16，断连击。惩罚最重的一个。' },
  wasabi: { kind:'junk', r:26, food:8,  spd:1.10, name:'芥末饭',
            desc:'长得像白饭的坏东西。-8 饱食度、断连击、屏幕抖动。' },
  jelly:  { kind:'junk', r:30, food:8,  spd:0.88, blur:2, name:'水母',
            desc:'-8 饱食度、断连击，画面模糊 2 秒。' }
};
var JUNK_POOL  = ['bag','can','wasabi','jelly'];
var BUFF_POOL  = ['onigiri','bubble','star','chew','magnet','goldrain'];
var CODEX_ORDER = ['rice','golden','onigiri','bubble','star','chew','magnet','goldrain','bag','can','wasabi','jelly'];
var CODEX_PER_PAGE = 6;
var CODEX_PAGES = Math.ceil(CODEX_ORDER.length / CODEX_PER_PAGE);

/* ---------------- 状态 ---------------- */
var state = 'title';              // title | diff | codex | best | play | pause | over
var menuIdx = 0;
var menuItems = [];
var diffReturnTo = 'title';       // 难度页选完回哪
var codexPage = 0;

var P = { x:W/2, vx:0, mouthOpen:false, stun:0, eatAnim:0, hurtAnim:0 };
var G = null;                     // 当前这一局

var bubbles = [];
for (var bi = 0; bi < 34; bi++) {
  bubbles.push({ x:Math.random()*W, y:Math.random()*H, r:1.5+Math.random()*4.5,
                 s:10+Math.random()*26, a:0.06+Math.random()*0.16 });
}

function newGame(diffKey){
  var d = DIFFS[diffKey] || DIFFS.normal;
  G = {
    diff: d, time: 0, score: 0, eaten: 0, misses: 0, junk: 0,
    combo: 0, maxCombo: 0,
    fullness: FULLNESS_START,
    items: [], pops: [], parts: [],
    spawnT: 0.4,
    shake: 0, blur: 0, stunFlash: 0,
    shield: 0, dbl: 0, slow: 0, magnet: 0, gold: 0,
    goal: d.goal,
    over: false, overT: 0, newBest: false, win: false, bonus: 0
  };
  P.x = W/2; P.vx = 0; P.mouthOpen = false; P.stun = 0; P.eatAnim = 0; P.hurtAnim = 0;
}

/* ---------------- 工具 ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pop(x, y, txt, col, big){
  G.pops.push({ x:x, y:y, txt:txt, col:col, t:0, life:0.95, big:!!big });
}
function spark(x, y, col, n, spd){
  for (var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, s = rnd(40, spd||210);
    G.parts.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 40,
                   r:rnd(2,4.6), col:col, t:0, life:rnd(0.35,0.75) });
  }
}
function mult(){ return Math.min(1 + Math.floor(G.combo/5), 5); }
function bestNow(){ return save.best[G.diff.key]|0; }

/* ---------------- 出怪 ---------------- */
function buffsOnField(){
  var n = 0;
  for (var i=0;i<G.items.length;i++) if (G.items[i].def.kind === 'buff') n++;
  return n;
}
function spawnItem(){
  var t = G.time, d = G.diff;
  var penP = t < d.penStart ? 0 : Math.min(1, (t - d.penStart)/25) * d.penRatio;
  var r = Math.random(), key;
  if (r < BUFF_CHANCE && buffsOnField() < BUFF_ON_FIELD_MAX) {
    key = BUFF_POOL[(Math.random()*BUFF_POOL.length)|0];
  } else if (r < BUFF_CHANCE + penP) {
    key = JUNK_POOL[(Math.random()*JUNK_POOL.length)|0];
  } else {
    key = Math.random() < 0.22 ? 'golden' : 'rice';
  }
  if (key === 'rice' && G.gold > 0) key = 'golden';   // 黄金雨：白饭全部变黄金饭
  var def = ITEMS[key];
  var ramp = 1 + Math.min(G.time/SPEED_RAMP_SEC, 1) * SPEED_RAMP_MAX;
  var r0 = def.r;
  G.items.push({
    key:key, def:def, x: rnd(70 + r0, W - 70 - r0), y: -60 - r0,
    vy: d.speed * def.spd * ramp * rnd(0.94, 1.06),
    r: r0, rot: rnd(-0.35,0.35), rotV: rnd(-1.5,1.5),
    ph: Math.random()*Math.PI*2, t:0, dead:false
  });
}

/* ---------------- 判定与结算 ---------------- */
function hitMouth(it){
  var mx = P.x, my = GROUND - ART_H + ART_H*SPR_MY;
  var dx = (it.x - mx)/(MOUTH_RX + it.r), dy = (it.y - my)/(MOUTH_RY + it.r);
  return dx*dx + dy*dy <= 1;
}
function hitBody(it){
  var top = GROUND - ART_H*BODY_TOP_F;
  if (it.y + it.r < top || it.y - it.r > GROUND + 8) return false;
  return Math.abs(it.x - P.x) <= BODY_HW + it.r;
}

function eatFood(it){
  var base = it.def.score, m = mult(), db = G.dbl > 0 ? 2 : 1;
  var gain = Math.round(base * m * db * G.diff.scoreMul);
  G.score += gain; G.eaten++; G.combo++;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  G.fullness = Math.min(FULLNESS_MAX, G.fullness + it.def.food);
  P.eatAnim = 1;
  pop(it.x, it.y, '+' + gain + (db>1?' x2':'') + (m>1?' (' + m + '倍)':''),
      it.key === 'golden' ? C.gold : C.white, it.key === 'golden');
  spark(it.x, it.y, it.key === 'golden' ? C.gold : '#ffffff', it.key === 'golden' ? 16 : 8, 200);
  if (it.key === 'golden') SFX.golden(); else SFX.eat(G.combo);
}
function eatJunk(it){
  G.combo = 0; G.junk++;
  G.fullness = Math.max(0, G.fullness - it.def.food);
  P.hurtAnim = 1;
  pop(it.x, it.y, it.def.food * -1 + ' 饱食', '#ff6b81', true);
  spark(it.x, it.y, '#ff8fa3', 14, 240);
  G.shake = Math.max(G.shake, it.def.blur ? 0.30 : 0.26);
  if (it.def.blur) G.blur = Math.max(G.blur, it.def.blur);
  if (it.key === 'wasabi') G.shake = Math.max(G.shake, 0.46);
  if (it.key === 'bag') { P.stun = Math.max(P.stun, 1.2); G.stunFlash = 1; }
  SFX.junk();
  if (G.fullness <= 0) endGame(false);
}
function eatBuff(it){
  G.combo++;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  var b = it.def.buff;
  if (b === 'fullness') {
    G.fullness = Math.min(FULLNESS_MAX, G.fullness + FULLNESS_MAX*0.35);
    pop(it.x, it.y, '饱食 +35%', C.green, true);
  } else if (b === 'shield') {
    G.shield = 8; pop(it.x, it.y, '护盾 8s', C.cyan, true);
  } else if (b === 'double') {
    G.dbl = 10; pop(it.x, it.y, '双倍 10s', C.gold, true);
  } else if (b === 'slow') {
    G.slow = 8; pop(it.x, it.y, '细嚼慢咽 8s', C.green, true);
  } else if (b === 'magnet') {
    G.magnet = 8; pop(it.x, it.y, '鲸吞磁力 8s', C.cyan, true);
  } else if (b === 'gold') {
    G.gold = 10; pop(it.x, it.y, '黄金雨 10s', C.gold, true);
  }
  spark(it.x, it.y, C.cyan, 16, 240);
  P.eatAnim = 1;
  SFX.buff();
}
function bounce(it, safe){
  it.dead = true;
  if (!safe) {
    G.combo = 0; G.misses++;
    pop(it.x, it.y, '漏接', '#bcd8ee', false);
    SFX.miss();
  }
}
function endGame(win){
  if (G.over) return;
  G.over = true; G.overT = 0;
  G.win = !!win;
  if (G.win) {
    G.bonus = Math.round(WIN_BONUS * G.diff.scoreMul);
    G.score += G.bonus;
  } else G.bonus = 0;
  var key = G.diff.key;
  if (G.score > (save.best[key]|0)) { save.best[key] = G.score; G.newBest = true; persist(); }
  state = 'over';
  if (G.win) SFX.win(); else SFX.over();
}

/* ---------------- 更新 ---------------- */
function update(dt){
  // 背景气泡一直动
  for (var i=0;i<bubbles.length;i++){
    var b = bubbles[i];
    b.y -= b.s*dt; b.x += Math.sin((b.y+b.r*30)*0.02)*6*dt;
    if (b.y < -12) { b.y = H + 12; b.x = Math.random()*W; }
  }

  if (state === 'title' || state === 'diff' || state === 'codex' || state === 'best') {
    updateDeco(dt); return;
  }

  if (state === 'over') {
    G.overT += dt;
    stepItems(G.overT < 0.9 ? dt*0.35 : 0);   // 结束后残留下落物减速停住
    updateFx(dt);
    return;
  }

  if (state === 'pause') return;

  /* ---- play ---- */
  G.time += dt;

  // 通关判定：撑满这一顿就算赢
  if (G.time >= G.goal) { G.fullness = Math.max(G.fullness, 0); endGame(true); return; }

  // 移动（带轻微惯性）
  var dir = (rightHeld()?1:0) - (leftHeld()?1:0);
  var ACC = MOVE_ACC, DAMP = MOVE_DAMP, MAXV = MOVE_MAXV;
  P.vx += dir * ACC * dt;
  P.vx -= P.vx * Math.min(DAMP*dt, 1);
  if (!dir && Math.abs(P.vx) < 12) P.vx = 0;
  P.vx = clamp(P.vx, -MAXV, MAXV);
  P.x += P.vx * dt;
  if (P.x < 74) { P.x = 74; P.vx = Math.abs(P.vx)*0.25; }
  if (P.x > W-74) { P.x = W-74; P.vx = -Math.abs(P.vx)*0.25; }

  // 嘴巴
  if (P.stun > 0) { P.stun -= dt; P.mouthOpen = false; }
  else P.mouthOpen = mouthHeld();

  // buff 计时
  if (G.shield > 0) G.shield = Math.max(0, G.shield - dt);
  if (G.dbl    > 0) G.dbl    = Math.max(0, G.dbl    - dt);
  if (G.slow   > 0) G.slow   = Math.max(0, G.slow   - dt);
  if (G.magnet > 0) G.magnet = Math.max(0, G.magnet - dt);
  if (G.gold   > 0) G.gold   = Math.max(0, G.gold   - dt);
  if (P.eatAnim > 0)  P.eatAnim  = Math.max(0, P.eatAnim - dt*3.2);
  if (P.hurtAnim > 0) P.hurtAnim = Math.max(0, P.hurtAnim - dt*2.2);

  // 饱食度自然下降
  G.fullness -= G.diff.drain * dt;
  if (G.fullness <= 0) { G.fullness = 0; endGame(false); return; }

  // 出怪
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    spawnItem();
    var ramp = 1 + Math.min(G.time/SPEED_RAMP_SEC, 1) * SPEED_RAMP_MAX;
    G.spawnT = G.diff.spawn * rnd(0.78, 1.24) / Math.sqrt(ramp);
  }

  stepItems(dt);
  updateFx(dt);
}

function stepItems(dt){
  var spdMul = G.slow > 0 ? SLOW_FACTOR : 1;   // 细嚼慢咽：全场下落减速
  for (var i=0;i<G.items.length;i++){
    var it = G.items[i];
    if (it.dead) continue;
    it.t += dt;
    it.y += it.vy * spdMul * dt;
    it.rot += it.rotV * dt;
    // 鲸吞磁力：把白饭/黄金饭横向吸向嘴巴
    if (G.magnet > 0 && (it.key === 'rice' || it.key === 'golden')) {
      var pull = 560 * dt, ddx = P.x - it.x;
      it.x += Math.abs(ddx) <= pull ? ddx : (ddx > 0 ? pull : -pull);
      it.x = clamp(it.x, 34, W - 34);
    }

    if (G.over) { if (it.y > H + 80) it.dead = true; continue; }

    if (hitMouth(it)) {
      if (P.mouthOpen && !(it.def.kind === 'junk' && G.shield > 0)) {
        if (it.def.kind === 'food')       { eatFood(it); it.dead = true; }
        else if (it.def.kind === 'junk')  { eatJunk(it); it.dead = true; }
        else                              { eatBuff(it); it.dead = true; }
      } else {
        bounce(it, it.def.kind !== 'food');
      }
      continue;
    }
    if (hitBody(it)) bounce(it, it.def.kind !== 'food');
  }
  for (var j=G.items.length-1;j>=0;j--) if (G.items[j].dead || G.items[j].y > H+120) G.items.splice(j,1);
}

function updateFx(dt){
  var i;
  for (i=G.pops.length-1;i>=0;i--){
    var p = G.pops[i]; p.t += dt; p.y -= 42*dt;
    if (p.t >= p.life) G.pops.splice(i,1);
  }
  for (i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i]; q.t += dt;
    q.vy += 620*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= (1 - 1.6*dt);
    if (q.t >= q.life) G.parts.splice(i,1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*1.7);
  if (G.blur > 0)  G.blur  = Math.max(0, G.blur  - dt);
  if (G.stunFlash > 0) G.stunFlash = Math.max(0, G.stunFlash - dt*1.6);
}

function fluffyPath(g, r, n, wob){
  g.beginPath();
  for (var i=0;i<=n;i++){
    var a = i/n*Math.PI*2 - Math.PI/2;
    var rr = r * (1 + ((i%2) ? wob : -wob));
    var x = Math.cos(a)*rr, y = Math.sin(a)*rr;
    if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.closePath();
}

  g.beginPath(); g.ellipse(0, r*0.95, r*0.8, r*0.22, 0, 0, 6.3); g.fill(); g.restore();

function drawMagnet(g, r){
  var gr = g.createRadialGradient(0,0,r*0.3,0,0,r*1.8);
  gr.addColorStop(0,'rgba(120,230,255,.45)'); gr.addColorStop(1,'rgba(120,230,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,r*1.8,0,6.3); g.fill();
  g.beginPath();
  g.arc(0, -r*0.10, r*0.78, Math.PI, 0, false);
  g.lineTo( r*0.78, r*0.64);
  g.lineTo( r*0.40, r*0.64);
  g.lineTo( r*0.40, -r*0.10);
  g.arc(0, -r*0.10, r*0.40, 0, Math.PI, true);
  g.lineTo(-r*0.40, r*0.64);
  g.lineTo(-r*0.78, r*0.64);
  g.closePath();
  var lg = g.createLinearGradient(-r*0.78,0,r*0.78,0);
  lg.addColorStop(0,'#f0f4f8'); lg.addColorStop(0.5,'#bccadb'); lg.addColorStop(1,'#8798a8');
  g.fillStyle = lg; g.fill();
  g.lineWidth = 2.2; g.strokeStyle = '#5d707f'; g.stroke();
  g.fillStyle = '#e0524f'; g.fillRect(-r*0.78, r*0.30, r*0.38, r*0.34);
  g.fillStyle = '#3f7fd0'; g.fillRect( r*0.40, r*0.30, r*0.38, r*0.34);
  g.lineWidth = 1.4; g.strokeStyle = 'rgba(40,60,80,.45)';
  g.strokeRect(-r*0.78, r*0.30, r*0.38, r*0.34);
  g.strokeRect( r*0.40, r*0.30, r*0.38, r*0.34);
}

/* ---- 黄金雨：金饭碗 ---- */
function drawGoldRain(g, r){
  var gr = g.createRadialGradient(0,0,r*0.3,0,0,r*1.9);
  gr.addColorStop(0,'rgba(255,220,110,.55)'); gr.addColorStop(1,'rgba(255,220,110,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,r*1.9,0,6.3); g.fill();
  for (var i=0;i<3;i++){
    var dx = (i-1)*r*0.56, dy = -r*1.00 - (i%2)*r*0.22;
    g.beginPath(); g.ellipse(dx, dy, r*0.13, r*0.19, 0, 0, 6.3);
    g.fillStyle = '#ffe08a'; g.fill();
    g.lineWidth = 1.6; g.strokeStyle = '#b98421'; g.stroke();
  }
  fluffyPath(g, r*0.84, 10, 0.05);
  g.fillStyle = '#ffe08a'; g.fill();
  g.lineWidth = 2.4; g.strokeStyle = '#b98421'; g.stroke();
  g.beginPath();
  g.moveTo(-r*0.94, r*0.02);
  g.quadraticCurveTo(-r*0.80, r*0.94, 0, r*0.98);
  g.quadraticCurveTo( r*0.80, r*0.94, r*0.94, r*0.02);
  g.closePath();
  var bg2 = g.createLinearGradient(0,0,0,r);
  bg2.addColorStop(0,'#ffffff'); bg2.addColorStop(1,'#cfe2f2');
  g.fillStyle = bg2; g.fill();
  g.lineWidth = 2.4; g.strokeStyle = '#7fa8c8'; g.stroke();
  g.beginPath(); g.moveTo(-r*0.98, r*0.02); g.lineTo(r*0.98, r*0.02);
  g.lineWidth = 3; g.strokeStyle = '#5b87ab'; g.stroke();
}

function drawItemIcon(g, key, r){
  if (key === 'rice' || key === 'golden' || key === 'wasabi') drawRice(g, r, key);
  else if (key === 'onigiri')  drawOnigiri(g, r);
  else if (key === 'bubble')   drawBubble(g, r);
  else if (key === 'star')     drawStar(g, r);
  else if (key === 'chew')     drawChew(g, r);
  else if (key === 'magnet')   drawMagnet(g, r);
  else if (key === 'goldrain') drawGoldRain(g, r);
  else if (key === 'bag')      drawBag(g, r);
  else if (key === 'can')      drawCan(g, r);
  else if (key === 'jelly')    drawJelly(g, r);
}

/* ============================================================
   绘制：角色
   ============================================================ */
function drawPlayer(g){
  var img = (P.mouthOpen && artOK) ? ART.open : ART.closed;
  var bob = Math.sin(G.time*3.1)*2.4;
  var tilt = clamp(P.vx/1500, -0.10, 0.10);

  // 影子
  g.save();
  g.globalAlpha = 0.22; g.fillStyle = '#062036';
  g.beginPath(); g.ellipse(P.x, GROUND + 4, 76, 15, 0, 0, 6.3); g.fill();
  g.restore();

  g.save();
  g.translate(P.x, GROUND + bob);
  g.rotate(tilt);
  if (P.hurtAnim > 0) {
    g.globalAlpha = 1;
    // 受击闪白：先画一层红色叠加
  }
  if (artOK) {
    var sh = ART_H, sw = artSize(img);
    var dx = -sw*SPR_CX, dy = -sh;
    if (P.stun > 0) {
      g.save();
      g.translate(dx + sw/2, dy + sh*0.30);
      g.rotate(Math.sin(G.time*26)*0.07);
      g.translate(-(dx + sw/2), -(dy + sh*0.30));
    }
    g.drawImage(img, dx, dy, sw, sh);
    if (P.stun > 0) g.restore();
  } else {
    drawFallbackWhale(g);
  }
  g.restore();

  // 护盾泡泡
  if (G.shield > 0) {
    var t = G.time*2.2;
    g.save();
    g.globalAlpha = 0.34 + Math.sin(t)*0.10 + (G.shield < 1.6 ? (Math.sin(G.time*22)*0.16) : 0);
    g.strokeStyle = '#bff2ff'; g.lineWidth = 5;
    g.beginPath();
    g.ellipse(P.x, GROUND - ART_H*0.52, ART_H*0.62, ART_H*0.66, 0, 0, 6.3);
    g.stroke();
    g.globalAlpha *= 0.30; g.fillStyle = '#8ee6ff'; g.fill();
    g.restore();
  }
  // 硬直提示
  if (P.stun > 0) {
    g.save();
    g.font = 'bold 22px "PingFang SC",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(255,180,120,.95)';
    g.fillText('被封住啦！', P.x, GROUND - ART_H*1.06 + Math.sin(G.time*18)*3);
    g.restore();
  }
}

function drawFallbackWhale(g){
  // 立绘加载失败时的兜底形象（不至于黑屏）
  var sh = ART_H;
  g.save(); g.translate(0, -sh);
  g.fillStyle = '#2f6bb0';
  g.beginPath(); g.ellipse(0, sh*0.62, sh*0.30, sh*0.40, 0, 0, 6.3); g.fill();
  g.beginPath(); g.ellipse(0, sh*0.24, sh*0.34, sh*0.27, 0, 0, 6.3); g.fill();
  g.fillStyle = '#dff2ff';
  g.beginPath(); g.ellipse(0, sh*0.70, sh*0.19, sh*0.26, 0, 0, 6.3); g.fill();
  g.fillStyle = '#1b3a63';
  g.beginPath(); g.moveTo(sh*0.30, sh*0.22); g.lineTo(sh*0.56, sh*0.10); g.lineTo(sh*0.40, sh*0.34); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-sh*0.30, sh*0.22); g.lineTo(-sh*0.56, sh*0.10); g.lineTo(-sh*0.40, sh*0.34); g.closePath(); g.fill();
  g.fillStyle = '#0e2137';
  g.beginPath(); g.arc(-sh*0.12, sh*0.22, sh*0.038, 0, 6.3); g.fill();
  g.beginPath(); g.arc( sh*0.12, sh*0.22, sh*0.038, 0, 6.3); g.fill();
  g.beginPath();
  if (P.mouthOpen) g.arc(0, sh*0.33, sh*0.058, 0, 6.3);
  else { g.moveTo(-sh*0.05, sh*0.33); g.quadraticCurveTo(0, sh*0.37, sh*0.05, sh*0.33); }
  g.fillStyle = P.mouthOpen ? '#b3405a' : '#0e2137';
  g.fill();
  if (!P.mouthOpen) { g.lineWidth = 2.4; g.strokeStyle = '#0e2137'; g.stroke(); }
  g.restore();
}

/* ============================================================
   绘制：场景
   ============================================================ */
function drawBackground(g){
  var lg = g.createLinearGradient(0,0,0,H);
  lg.addColorStop(0.00, '#08243f');
  lg.addColorStop(0.42, '#12456e');
  lg.addColorStop(0.78, '#1c618f');
  lg.addColorStop(1.00, '#2b7ea8');
  g.fillStyle = lg; g.fillRect(0,0,W,H);

  // 光柱
  g.save();
  for (var i=0;i<5;i++){
    var x = 90 + i*205 + Math.sin(G ? G.time*0.32 + i : i)*16;
    g.globalAlpha = 0.055 + (i%2)*0.02;
    g.fillStyle = '#bfe9ff';
    g.beginPath();
    g.moveTo(x-28, -10); g.lineTo(x+30, -10);
    g.lineTo(x+95, H); g.lineTo(x-88, H);
    g.closePath(); g.fill();
  }
  g.restore();

  // 气泡
  g.save();
  for (var b=0;b<bubbles.length;b++){
    var bb = bubbles[b];
    g.globalAlpha = bb.a;
    g.fillStyle = '#d7f2ff';
    g.beginPath(); g.arc(bb.x, bb.y, bb.r, 0, 6.3); g.fill();
  }
  g.restore();

  // 海床
  g.save();
  g.globalAlpha = 0.5;
  var sg = g.createLinearGradient(0,H-70,0,H);
  sg.addColorStop(0,'rgba(30,70,105,0)'); sg.addColorStop(1,'rgba(12,42,70,.85)');
  g.fillStyle = sg; g.fillRect(0,H-80,W,80);
  g.restore();
}

function drawProgress(g){
  var prog = clamp(G.time / G.goal, 0, 1);
  g.save();
  g.fillStyle = 'rgba(4,20,36,.60)';
  g.fillRect(0, 0, W, 10);
  var pg = g.createLinearGradient(0,0,W,0);
  pg.addColorStop(0,'#5fd08a'); pg.addColorStop(0.55,'#5cc8e8'); pg.addColorStop(1,'#e8b74a');
  g.fillStyle = pg;
  g.fillRect(0, 0, Math.max(2, W*prog), 10);
  g.globalAlpha = 0.35; g.fillStyle = '#ffffff';
  g.fillRect(0, 0, Math.max(2, W*prog), 4);
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(220,245,255,.90)';
  g.font = 'bold 11px "PingFang SC",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('开饭进度 ' + Math.round(prog*100) + '%', W/2, 16);
  g.restore();
}

function drawCountdown(g){
  var left = Math.max(0, G.goal - G.time);
  var warn = left <= 10;
  var pw = 168, ph = 54, px = W - 40 - pw, py = 20;
  g.save();
  g.fillStyle = 'rgba(6,26,44,.66)';
  roundRect(g, px, py, pw, ph, 14); g.fill();
  g.strokeStyle = warn ? 'rgba(255,214,120,.90)' : 'rgba(140,215,255,.45)';
  g.lineWidth = 1.8;
  roundRect(g, px, py, pw, ph, 14); g.stroke();
  if (warn) {
    g.globalAlpha = 0.16 + Math.sin(G.time*10)*0.10;
    g.fillStyle = '#ffd96b';
    roundRect(g, px, py, pw, ph, 14); g.fill();
    g.globalAlpha = 1;
  }
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(170,215,240,.85)';
  g.font = 'bold 13px "PingFang SC",sans-serif';
  g.fillText('开饭倒计时', px+14, py+17);
  g.fillStyle = warn ? '#ffd96b' : '#eaf7ff';
  g.font = 'bold 26px "PingFang SC",sans-serif';
  g.fillText(left.toFixed(1) + 's', px+14, py+39);
  g.textAlign = 'right';
  g.fillStyle = 'rgba(170,215,240,.70)';
  g.font = 'bold 13px "PingFang SC",sans-serif';
  g.fillText(G.diff.name + ' · ' + G.goal + 's', px+pw-12, py+17);
  g.restore();
}

function drawHUD(g){
  drawProgress(g);
  drawCountdown(g);
  var bx = 40, bw = W-80, by = H-40, bh = 20;

  // 饱食度条
  g.save();
  g.fillStyle = 'rgba(4,20,36,.65)';
  roundRect(g, bx-4, by-4, bw+8, bh+8, 14); g.fill();
  var pct = clamp(G.fullness / FULLNESS_MAX, 0, 1);
  var col;
  if (pct > 0.55)      col = ['#6ee7a8','#31b57c'];
  else if (pct > 0.30) col = ['#ffd36b','#f0a52c'];
  else                 col = ['#ff8a95','#e0475c'];
  var fg = g.createLinearGradient(bx,0,bx+bw,0);
  fg.addColorStop(0,col[0]); fg.addColorStop(1,col[1]);
  g.fillStyle = fg;
  roundRect(g, bx, by, Math.max(6, bw*pct), bh, 10); g.fill();
  g.globalAlpha = 0.22; g.fillStyle = '#ffffff';
  roundRect(g, bx, by, Math.max(6, bw*pct), bh*0.44, 10); g.fill();
  g.globalAlpha = 1;
  g.strokeStyle = 'rgba(190,235,255,.45)'; g.lineWidth = 1.5;
  roundRect(g, bx, by, bw, bh, 10); g.stroke();
  g.font = 'bold 15px "PingFang SC",sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(230,248,255,.92)';
  g.fillText('饱食度', bx+2, by-16);
  g.textAlign = 'right';
  g.fillText(Math.round(G.fullness) + '%', bx+bw-2, by-16);
  g.restore();

  // 分数 / 最高分
  g.save();
  g.textAlign = 'left'; g.textBaseline = 'top';
  g.fillStyle = 'rgba(220,245,255,.95)';
  g.font = 'bold 42px "PingFang SC",sans-serif';
  g.fillText(String(G.score), 40, 26);
  g.font = 'bold 15px "PingFang SC",sans-serif';
  g.fillStyle = 'rgba(170,215,240,.85)';
  g.fillText('最高 ' + Math.max(bestNow(), G.score), 42, 74);
  g.fillStyle = 'rgba(170,215,240,.80)';
  g.fillText(G.diff.name, 42, 96);
  g.restore();

  // 连击
  if (G.combo >= 2) {
    var m = mult();
    var pulse = 1 + Math.max(0, 0.5 - (G.combo % 5)) * 0.10;
    g.save();
    g.textAlign = 'center'; g.textBaseline = 'top';
    g.translate(0, 22 + Math.sin(G.time*8)*2);
    g.fillStyle = m > 1 ? '#ffd96b' : 'rgba(210,240,255,.9)';
    g.font = 'bold ' + Math.round(34*pulse) + 'px "PingFang SC",sans-serif';
    g.fillText('连击 ' + G.combo, W/2, 0);
    if (m > 1) {
      g.fillStyle = '#ffb347';
      g.font = 'bold 24px "PingFang SC",sans-serif';
      g.fillText('分数 x' + m, W/2, 40);
    }
    g.restore();
  }

  // buff 图标（最多并排 5 个）
  var buffs = [];
  if (G.shield > 0) buffs.push({ k:'bubble',   t:G.shield, max:8,  txt:'护盾' });
  if (G.dbl    > 0) buffs.push({ k:'star',     t:G.dbl,    max:10, txt:'双倍' });
  if (G.slow   > 0) buffs.push({ k:'chew',     t:G.slow,   max:8,  txt:'慢速' });
  if (G.magnet > 0) buffs.push({ k:'magnet',   t:G.magnet, max:8,  txt:'磁力' });
  if (G.gold   > 0) buffs.push({ k:'goldrain', t:G.gold,   max:10, txt:'黄金雨' });
  var iy = 134;
  for (var i=0;i<buffs.length && i<5;i++){
    var bf = buffs[i];
    var cxb = W - 100*(i+1), frac = clamp(bf.t/bf.max, 0, 1);
    g.save();
    g.fillStyle = 'rgba(6,26,44,.70)';
    roundRect(g, cxb, iy-26, 92, 52, 12); g.fill();
    g.strokeStyle = 'rgba(150,225,255,.55)'; g.lineWidth = 1.6;
    roundRect(g, cxb, iy-26, 92, 52, 12); g.stroke();
    g.save(); g.translate(cxb+24, iy-2); drawItemIcon(g, bf.k, 15); g.restore();
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(220,245,255,.95)';
    g.font = 'bold 13px "PingFang SC",sans-serif';
    g.fillText(bf.txt, cxb+46, iy-11);
    g.fillStyle = '#7fe6ff';
    g.font = 'bold 14px "PingFang SC",sans-serif';
    g.fillText(bf.t.toFixed(1) + 's', cxb+46, iy+7);
    g.fillStyle = 'rgba(120,225,255,.30)';
    roundRect(g, cxb+10, iy+15, 72, 4, 2); g.fill();
    g.fillStyle = 'rgba(120,225,255,.95)';
    roundRect(g, cxb+10, iy+15, Math.max(2, 72*frac), 4, 2); g.fill();
    g.restore();
  }
}

function drawPops(g){
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (var i=0;i<G.pops.length;i++){
    var p = G.pops[i], k = 1 - p.t/p.life;
    g.globalAlpha = clamp(k*1.5, 0, 1);
    var size = p.big ? 27 : 21;
    g.font = 'bold ' + Math.round(size * (1 + (1-k)*0.18)) + 'px "PingFang SC",sans-serif';
    g.lineWidth = 4; g.strokeStyle = 'rgba(6,22,40,.75)';
    g.strokeText(p.txt, p.x, p.y);
    g.fillStyle = p.col;
    g.fillText(p.txt, p.x, p.y);
  }
  g.restore();
}
function drawParts(g){
  g.save();
  for (var i=0;i<G.parts.length;i++){
    var q = G.parts[i], k = 1 - q.t/q.life;
    g.globalAlpha = clamp(k,0,1);
    g.fillStyle = q.col;
    g.beginPath(); g.arc(q.x, q.y, q.r*k + 0.8, 0, 6.3); g.fill();
  }
  g.restore();
}

function roundRect(g, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r, y);
  g.lineTo(x+w-r, y); g.quadraticCurveTo(x+w, y, x+w, y+r);
  g.lineTo(x+w, y+h-r); g.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  g.lineTo(x+r, y+h); g.quadraticCurveTo(x, y+h, x, y+h-r);
  g.lineTo(x, y+r); g.quadraticCurveTo(x, y, x+r, y);
  g.closePath();
}

function panel(g, x, y, w, h, r){
  g.save();
  g.fillStyle = 'rgba(6,24,42,.80)';
  roundRect(g, x, y, w, h, r||16); g.fill();
  g.strokeStyle = 'rgba(140,215,255,.35)'; g.lineWidth = 1.6;
  roundRect(g, x, y, w, h, r||16); g.stroke();
  g.restore();
}

  g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.3); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold ' + (fontPx || Math.round(b.r*0.9)) + 'px "PingFang SC",sans-serif';

  g.globalAlpha = pressed ? 1 : 0.80;
  g.fillText(glyph, b.x, b.y + b.r*0.035);
  g.restore();
}

function wrapText(g, text, x, y, maxW, lineH){
  var line = '';
  for (var i=0;i<text.length;i++){
    var test = line + text[i];
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); y += lineH; line = text[i]; }
    else line = test;
  }
  if (line) g.fillText(line, x, y);
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  HITS = [];   // 每帧重建点击热区（上一帧的热区负责处理这一帧的点击）

  var sx = 0, sy = 0;
  if (G && G.shake > 0 && state === 'play') {
    var m = G.shake * 13;
    sx = (Math.random()*2-1)*m; sy = (Math.random()*2-1)*m;
  } else if (G && G.shake > 0 && state === 'over') {
    var m2 = G.shake * 8;
    sx = (Math.random()*2-1)*m2; sy = (Math.random()*2-1)*m2;
  }

  ctx.save();
  ctx.translate(sx, sy);

  var blurOn = G && G.blur > 0 && (state === 'play' || state === 'over');
  var canFilter = typeof ctx.filter === 'string';
  if (blurOn && canFilter) ctx.filter = 'blur(' + (3 + Math.min(G.blur,2)*1.6).toFixed(1) + 'px)';

  drawBackground(ctx);

  if (state === 'title') {
    titleT += 1/60;
    drawTitle(ctx);
  } else if (state === 'diff') {
    drawDiff(ctx, diffReturnTo === 'play');
  } else if (state === 'codex') {
    drawCodex(ctx);
  } else if (state === 'best') {
    drawBest(ctx);
  } else {
    for (var i=0;i<G.items.length;i++) drawItem(ctx, G.items[i]);
    drawPlayer(ctx);
    if (blurOn && canFilter) ctx.filter = 'none';
    drawParts(ctx);
    drawPops(ctx);
    if (state === 'play') { drawHUD(ctx); if (touchUI) drawTouchUI(ctx); }
    if (state === 'pause') { drawHUD(ctx); drawPause(ctx); }
    if (state === 'over')  drawOver(ctx);
  }
  if (canFilter) ctx.filter = 'none';

  // 受击红晕
  if (G && P.hurtAnim > 0 && (state === 'play' || state === 'over')) {
    ctx.save();
    ctx.globalAlpha = P.hurtAnim * 0.30;
    var rg = ctx.createRadialGradient(W/2, H/2, H*0.22, W/2, H/2, H*0.82);
    rg.addColorStop(0,'rgba(255,60,90,0)'); rg.addColorStop(1,'rgba(255,60,90,.95)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // 饥饿警示
  if (G && state === 'play' && G.fullness < 25) {
    var a = (1 - G.fullness/25) * (0.16 + Math.sin(performance.now()/180)*0.10);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    var g2 = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.9);
    g2.addColorStop(0,'rgba(255,80,80,0)'); g2.addColorStop(1,'rgba(255,80,80,.9)');
    ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  ctx.restore();
}

/* ============================================================
   主循环
   ============================================================ */
var last = performance.now();
function frame(now){
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 1/25) dt = 1/25;      // 防止掉帧穿透
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   按键分发
   ============================================================ */
function onKey(code){
  if (state === 'title') {
    if (code === 'ArrowUp'   || code === 'KeyW') { menuIdx = (menuIdx + 4) % 5; SFX.ui(); }
    else if (code === 'ArrowDown' || code === 'KeyS') { menuIdx = (menuIdx + 1) % 5; SFX.ui(); }
    else if (code === 'Enter' || code === 'Space') { SFX.ui(); titleConfirm(); }
    return;
  }
  if (state === 'diff') {
    if (code === 'ArrowUp'   || code === 'KeyW') { menuIdx = (menuIdx + 2) % 3; SFX.ui(); }
    else if (code === 'ArrowDown' || code === 'KeyS') { menuIdx = (menuIdx + 1) % 3; SFX.ui(); }
    else if (code === 'Escape') { backToTitle(); SFX.ui(); }
    else if (code === 'Enter' || code === 'Space') { SFX.ui(); diffConfirm(); }
    return;
  }
  if (state === 'codex') {
    if (code === 'ArrowLeft'  || code === 'KeyA') { codexPrev(); SFX.ui(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { codexNext(); SFX.ui(); }
    else if (code === 'Escape' || code === 'Enter' || code === 'Space') { backToTitle(); SFX.ui(); }
    return;
  }
  if (state === 'best') {
    if (code === 'Escape' || code === 'Enter' || code === 'Space') { backToTitle(); SFX.ui(); }
    return;
  }
  if (state === 'play') {
    if (code === 'Escape') { clearTouch(); state = 'pause'; menuIdx = 0; SFX.ui(); }
    else if (code === 'KeyR') { newGame(G.diff.key); SFX.ui(); }
    return;
  }
  if (state === 'pause') {
    if (code === 'Escape') { state = 'play'; SFX.ui(); }
    else if (code === 'ArrowUp' || code === 'KeyW') { menuIdx = (menuIdx + 2) % 3; SFX.ui(); }
    else if (code === 'ArrowDown' || code === 'KeyS') { menuIdx = (menuIdx + 1) % 3; SFX.ui(); }
    else if (code === 'Enter' || code === 'Space') { SFX.ui(); pauseConfirm(); }
    return;
  }
  if (state === 'over') {
    if (code === 'Escape') { backToTitle(); SFX.ui(); }
    else if (code === 'Enter' || code === 'Space' || code === 'KeyR') { overConfirm(); SFX.ui(); }
    return;
  }
}

/* ============================================================
   指针事件（鼠标 + 触屏，多点）
   ============================================================ */
cv.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'touch' || e.pointerType === 'pen') touchUI = true;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.preventDefault) e.preventDefault();
  audioCtx();

  var p = localPos(e);

  if (state === 'play') {
    var r = roleAt(p.x, p.y);
    if (r.role === 'pause') { clearTouch(); state = 'pause'; menuIdx = 0; SFX.ui(); return; }
    contacts[e.pointerId] = r;
    syncTouch();
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }
  tapAt(p.x, p.y);          // 界面：点哪算哪（鼠标和手指都行）
});

cv.addEventListener('pointermove', function(e){
  var c = contacts[e.pointerId];
  if (!c || c.role !== 'btn') return;
  if (e.preventDefault) e.preventDefault();
  var p = localPos(e);
  if      (inCircle(p.x, p.y, BTN_L)) c.dir = -1;
  else if (inCircle(p.x, p.y, BTN_R)) c.dir =  1;
  else                                c.dir =  0;
  syncTouch();
});

function endContact(e){
  if (contacts[e.pointerId]){ delete contacts[e.pointerId]; syncTouch(); }
  try { if (cv.hasPointerCapture && cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId); } catch(err){}
}
cv.addEventListener('pointerup', endContact);
cv.addEventListener('pointercancel', endContact);
window.addEventListener('pointerup', endContact);
window.addEventListener('pointercancel', endContact);

/* 手机上的手势杂项一律挡掉：双击缩放 / 长按菜单 / 捏合 */
try {
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });
  ['gesturechange','gestureend','touchmove'].forEach(function(t){
    document.addEventListener(t, function(e){ if (e.cancelable !== false && e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
  });
} catch(e) {}

})();
</script>
